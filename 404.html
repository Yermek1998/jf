<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Бет табылмады</title>

  <!-- Lottie CDN -->
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto;
      background: radial-gradient(circle at 30% 20%, #0f172a, #020617);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }

    .card{
      max-width:520px;
    }

    #lottie{
      width:260px;
      height:260px;
      margin:0 auto 20px;
    }

    h1{
      font-size:32px;
      margin-bottom:10px;
    }

    p{
      opacity:.7;
      margin-bottom:20px;
    }

    a{
      display:inline-block;
      padding:12px 20px;
      border-radius:14px;
      background:linear-gradient(90deg,#22c55e,#16a34a);
      color:#062014;
      text-decoration:none;
      font-weight:700;
    }

    a:hover{
      opacity:.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="lottie"></div>
    <h1>404 — Бет табылмады</h1>
    <p>Сіз іздеген бет жоқ немесе сілтеме қате.</p>
    <a href="/">Басты бетке қайту</a>
  </div>

  <script>
    lottie.loadAnimation({
      container: document.getElementById('lottie'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: '/assets/404-animation.json' 
    });
  </script>

</body>
</html>
