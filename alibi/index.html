<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алан Аслан — Сүндет той</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --purple: #a855f7;
      --yellow: #fbbf24;
      --cyan: #22d3ee;
      --mint: #34d399;
      --orange: #fb923c;
      --card: rgba(255, 255, 255, 0.92);
      --shadow: 0 24px 60px rgba(120, 40, 160, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 20%, rgba(255, 107, 157, 0.35), transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(168, 85, 247, 0.3), transparent 32%),
        radial-gradient(circle at 80% 85%, rgba(34, 211, 238, 0.28), transparent 34%),
        radial-gradient(circle at 15% 80%, rgba(251, 191, 36, 0.32), transparent 30%),
        linear-gradient(135deg, #fff0f6 0%, #f3e8ff 35%, #ecfeff 70%, #fff7ed 100%);
      color: #4c1d95;
    }

    .page {
      width: min(1400px, calc(100vw - 64px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 0 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .balloon {
      position: absolute;
      width: 72px;
      height: 88px;
      border-radius: 50% 50% 48% 48%;
      opacity: 0.85;
      animation: floatBalloon 8s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    .balloon::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -42px;
      width: 2px;
      height: 42px;
      background: rgba(120, 80, 160, 0.35);
      transform: translateX(-50%);
    }

    .balloon.b1 { left: 6%; top: 12%; background: linear-gradient(180deg, #ff8fab, #ff6b9d); animation-delay: 0s; }
    .balloon.b2 { right: 8%; top: 18%; background: linear-gradient(180deg, #c084fc, #a855f7); animation-delay: 1.2s; width: 64px; height: 78px; }
    .balloon.b3 { left: 12%; bottom: 14%; background: linear-gradient(180deg, #67e8f9, #22d3ee); animation-delay: 2s; width: 58px; height: 72px; }
    .balloon.b4 { right: 14%; bottom: 10%; background: linear-gradient(180deg, #fde68a, #fbbf24); animation-delay: 0.6s; }
    .balloon.b5 { left: 48%; top: 6%; background: linear-gradient(180deg, #86efac, #34d399); animation-delay: 1.8s; width: 52px; height: 66px; }

    @keyframes floatBalloon {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-18px) rotate(3deg); }
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.9), transparent),
        radial-gradient(2px 2px at 80px 120px, rgba(255,255,255,0.7), transparent),
        radial-gradient(3px 3px at 160px 60px, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 240px 180px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 320px 90px, rgba(255,255,255,0.85), transparent);
      background-size: 360px 220px;
      opacity: 0.5;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.35; }
      to { opacity: 0.65; }
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge {
      display: inline-block;
      padding: 16px 36px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
    }

    h1 {
      font-size: clamp(48px, 6vw, 72px);
      font-weight: 900;
      line-height: 1.1;
      background: linear-gradient(135deg, #db2777, #9333ea, #0891b2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #7c3aed;
      font-weight: 700;
    }

    .main-card {
      width: 100%;
      max-width: 920px;
      background: var(--card);
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 40px;
      padding: 64px 56px 56px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .main-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 107, 157, 0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.12), transparent 42%);
      pointer-events: none;
    }

    .number-stage {
      position: relative;
      z-index: 1;
      margin: 16px 0 36px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .number-display {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 128px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(145deg, #ff6b9d 0%, #a855f7 45%, #22d3ee 100%);
      box-shadow:
        0 0 0 14px rgba(255, 255, 255, 0.85),
        0 0 0 20px rgba(168, 85, 247, 0.18),
        0 28px 60px rgba(168, 85, 247, 0.35);
      transition: transform 0.15s ease;
      position: relative;
    }

    .number-display.spinning {
      animation: pulseSpin 0.12s linear infinite;
    }

    @keyframes pulseSpin {
      0%, 100% { transform: scale(1) rotate(-1deg); }
      50% { transform: scale(1.04) rotate(1deg); }
    }

    @keyframes popReveal {
      0% { transform: scale(0.5); opacity: 0.4; }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }

    .congrats {
      margin-top: 28px;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 900;
      color: #db2777;
      opacity: 0;
      transform: translateY(16px) scale(0.9);
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .congrats.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: congratsPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), congratsGlow 1.2s ease-in-out 0.3s infinite alternate;
    }

    @keyframes congratsPop {
      0% { transform: translateY(30px) scale(0.5); opacity: 0; }
      55% { transform: translateY(-8px) scale(1.15); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes congratsGlow {
      from { text-shadow: 0 0 12px rgba(255, 107, 157, 0.5), 0 2px 0 rgba(255,255,255,0.8); }
      to { text-shadow: 0 0 28px rgba(168, 85, 247, 0.8), 0 0 40px rgba(251, 191, 36, 0.5), 0 2px 0 rgba(255,255,255,0.8); }
    }

    .main-card.celebrate-shake {
      animation: cardShake 0.55s ease-in-out;
    }

    @keyframes cardShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      15% { transform: translateX(-6px) rotate(-0.6deg); }
      30% { transform: translateX(7px) rotate(0.6deg); }
      45% { transform: translateX(-5px) rotate(-0.4deg); }
      60% { transform: translateX(5px) rotate(0.4deg); }
      75% { transform: translateX(-3px) rotate(-0.2deg); }
    }

    .number-display.reveal {
      animation: popReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), winnerPulse 1s ease-in-out 0.7s 3;
    }

    @keyframes winnerPulse {
      0%, 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0.85), 0 0 0 20px rgba(168,85,247,0.18), 0 28px 60px rgba(168,85,247,0.35); }
      50% { box-shadow: 0 0 0 14px rgba(255,255,255,0.95), 0 0 0 30px rgba(255,107,157,0.35), 0 0 70px rgba(251,191,36,0.45), 0 32px 70px rgba(168,85,247,0.45); }
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 26px;
      font-weight: 800;
      padding: 20px 56px;
      border-radius: 999px;
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.03);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-start {
      background: linear-gradient(135deg, #ff6b9d, #fb923c);
    }

    .btn-next {
      background: linear-gradient(135deg, #a855f7, #22d3ee);
      display: none;
    }

    .btn-next.visible {
      display: inline-block;
    }

    .history-wrap {
      width: 100%;
      max-width: 920px;
      margin-top: 32px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      padding: 28px 32px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px rgba(120, 40, 160, 0.08);
    }

    .history-title {
      font-size: 22px;
      font-weight: 800;
      color: #9333ea;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 48px;
    }

    .history-chip {
      min-width: 80px;
      padding: 16px 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fce7f3, #ede9fe);
      color: #7e22ce;
      font-weight: 900;
      font-size: 36px;
      line-height: 1;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.15);
    }

    .history-empty {
      color: #a78bfa;
      font-weight: 700;
      font-size: 20px;
    }

    .finished-msg {
      display: none;
      margin-top: 20px;
      padding: 18px 26px;
      border-radius: 18px;
      background: linear-gradient(90deg, #fef3c7, #fce7f3);
      color: #9a3412;
      font-weight: 800;
      font-size: 20px;
    }

    .finished-msg.show {
      display: block;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .ribbon {
      position: fixed;
      top: -20px;
      width: 14px;
      height: 90px;
      border-radius: 4px;
      opacity: 0;
      z-index: 99;
      pointer-events: none;
      animation: ribbonFall 2.8s ease-in forwards;
    }

    @keyframes ribbonFall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg);
      }
    }

    .falling-balloons-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 98;
      overflow: hidden;
    }

    .fall-balloon {
      position: absolute;
      top: -140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
      animation: balloonFall var(--fall-dur, 5s) linear forwards;
      filter: drop-shadow(0 10px 18px rgba(80, 30, 120, 0.2));
    }

    .fall-balloon-body {
      width: var(--balloon-size, 56px);
      height: calc(var(--balloon-size, 56px) * 1.18);
      border-radius: 50% 50% 46% 46%;
      background: var(--balloon-bg);
      position: relative;
      box-shadow: inset -10px -14px 0 rgba(0, 0, 0, 0.1), inset 8px 8px 0 rgba(255, 255, 255, 0.25);
    }

    .fall-balloon-body::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid var(--balloon-knot, #e879f9);
    }

    .fall-balloon-string {
      width: 2px;
      height: calc(50px + var(--balloon-size, 56px) * 0.4);
      background: linear-gradient(180deg, rgba(120, 80, 160, 0.5), rgba(120, 80, 160, 0.15));
      border-radius: 2px;
      transform-origin: top center;
      animation: stringSway 1.8s ease-in-out infinite alternate;
    }

    @keyframes balloonFall {
      0% {
        transform: translate3d(0, 0, 0) rotate(var(--start-rot, 0deg));
        opacity: 0;
      }
      5% { opacity: 1; }
      25% { transform: translate3d(var(--drift-mid, 30px), 28vh, 0) rotate(calc(var(--start-rot, 0deg) + 8deg)); }
      50% { transform: translate3d(var(--drift-back, -20px), 55vh, 0) rotate(calc(var(--start-rot, 0deg) - 6deg)); }
      75% { transform: translate3d(var(--drift-mid, 30px), 82vh, 0) rotate(calc(var(--start-rot, 0deg) + 5deg)); }
      100% {
        transform: translate3d(var(--drift-end, 10px), calc(100vh + 180px), 0) rotate(calc(var(--start-rot, 0deg) + 12deg));
        opacity: 0.9;
      }
    }

    @keyframes stringSway {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }

    .flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 97;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.55), transparent 65%);
      opacity: 0;
      animation: flashPop 0.6s ease-out forwards;
    }

    @keyframes flashPop {
      0% { opacity: 0; }
      20% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 700px) {
      .main-card {
        padding: 40px 24px 32px;
      }

      .number-display {
        width: 220px;
        height: 220px;
        font-size: 88px;
      }

      .badge {
        font-size: 24px;
        padding: 12px 24px;
      }

      .history-chip {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <div class="stars"></div>
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>
  </div>

  <canvas id="confettiCanvas" aria-hidden="true"></canvas>
  <div class="falling-balloons-layer" id="fallingBalloons" aria-hidden="true"></div>

  <div class="page">
    <header class="header">
      <div class="badge">🎂 Сүндет той</div>
      <h1>Алан Аслан</h1>
    </header>

    <section class="main-card" id="mainCard">
      <div class="number-stage">
        <div class="number-display" id="numberDisplay">?</div>
        <div class="congrats" id="congrats">Құтты болсын! 🎉</div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-start" id="btnStart">Бастау</button>
        <button type="button" class="btn btn-next" id="btnNext">Келесі</button>
      </div>

      <div class="finished-msg" id="finishedMsg">Барлық 200 сан таңдалды! Той аяқталды 🎈</div>
    </section>

    <section class="history-wrap">
      <div class="history-title">Шыққан сандар</div>
      <div class="history-list" id="historyList">
        <span class="history-empty">Әлі сан шыққан жоқ</span>
      </div>
    </section>
  </div>

  <script>
    const MIN = 1;
    const MAX = 200;
    const SPIN_DURATION = 5000;
    const SPIN_INTERVAL_START = 40;
    const SPIN_INTERVAL_END = 180;

    const numberDisplay = document.getElementById('numberDisplay');
    const congrats = document.getElementById('congrats');
    const btnStart = document.getElementById('btnStart');
    const btnNext = document.getElementById('btnNext');
    const finishedMsg = document.getElementById('finishedMsg');
    const historyList = document.getElementById('historyList');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const fallingBalloonsLayer = document.getElementById('fallingBalloons');
    const mainCard = document.getElementById('mainCard');

    let available = [];
    let drawn = [];
    let isSpinning = false;
    let spinTimer = null;

    function initPool() {
      available = [];
      for (let i = MIN; i <= MAX; i++) available.push(i);
      drawn = [];
      renderHistory();
      numberDisplay.textContent = '?';
      congrats.classList.remove('show');
      btnStart.style.display = 'inline-block';
      btnNext.classList.remove('visible');
      finishedMsg.classList.remove('show');
      btnStart.disabled = false;
      btnNext.disabled = false;
    }

    function renderHistory() {
      if (!drawn.length) {
        historyList.innerHTML = '<span class="history-empty">Әлі сан шыққан жоқ</span>';
        return;
      }
      historyList.innerHTML = drawn.map(function(n) {
        return '<span class="history-chip">' + n + '</span>';
      }).join('');
    }

    function pickRandom() {
      const idx = Math.floor(Math.random() * available.length);
      const value = available[idx];
      available.splice(idx, 1);
      return value;
    }

    function randomPreview() {
      return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
    }

    function launchRibbons() {
      const colors = ['#ff6b9d', '#a855f7', '#fbbf24', '#22d3ee', '#34d399', '#fb923c'];
      for (let i = 0; i < 48; i++) {
        const ribbon = document.createElement('div');
        ribbon.className = 'ribbon';
        ribbon.style.left = (Math.random() * 100) + 'vw';
        ribbon.style.background = colors[Math.floor(Math.random() * colors.length)];
        ribbon.style.animationDelay = (Math.random() * 0.6) + 's';
        ribbon.style.animationDuration = (2 + Math.random() * 2) + 's';
        ribbon.style.width = (10 + Math.random() * 10) + 'px';
        ribbon.style.height = (70 + Math.random() * 50) + 'px';
        document.body.appendChild(ribbon);
        setTimeout(function() { ribbon.remove(); }, 4500);
      }
    }

    const BALLOON_GRADIENTS = [
      'linear-gradient(160deg, #ff8fab 0%, #ff6b9d 100%)',
      'linear-gradient(160deg, #c084fc 0%, #a855f7 100%)',
      'linear-gradient(160deg, #fde68a 0%, #fbbf24 100%)',
      'linear-gradient(160deg, #67e8f9 0%, #22d3ee 100%)',
      'linear-gradient(160deg, #86efac 0%, #34d399 100%)',
      'linear-gradient(160deg, #fdba74 0%, #fb923c 100%)',
      'linear-gradient(160deg, #f9a8d4 0%, #ec4899 100%)',
      'linear-gradient(160deg, #93c5fd 0%, #3b82f6 100%)'
    ];

    const BALLOON_KNOTS = ['#e879f9', '#f472b6', '#c084fc', '#fbbf24', '#22d3ee', '#34d399'];

    function createFallBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'fall-balloon';
      const size = 44 + Math.random() * 52;
      const left = Math.random() * 92;
      const drift = (Math.random() - 0.5) * 140;
      balloon.style.left = left + 'vw';
      balloon.style.setProperty('--balloon-size', size + 'px');
      balloon.style.setProperty('--fall-dur', (4.5 + Math.random() * 2.5) + 's');
      balloon.style.setProperty('--start-rot', (Math.random() * 20 - 10) + 'deg');
      balloon.style.setProperty('--drift-mid', drift + 'px');
      balloon.style.setProperty('--drift-back', (-drift * 0.6) + 'px');
      balloon.style.setProperty('--drift-end', (drift * 0.4) + 'px');
      balloon.style.setProperty('--balloon-bg', BALLOON_GRADIENTS[Math.floor(Math.random() * BALLOON_GRADIENTS.length)]);
      balloon.style.setProperty('--balloon-knot', BALLOON_KNOTS[Math.floor(Math.random() * BALLOON_KNOTS.length)]);
      balloon.innerHTML = '<div class="fall-balloon-body"></div><div class="fall-balloon-string"></div>';
      fallingBalloonsLayer.appendChild(balloon);
      const duration = parseFloat(balloon.style.getPropertyValue('--fall-dur')) * 1000;
      setTimeout(function() { balloon.remove(); }, duration + 200);
    }

    function launchFallingBalloons() {
      const total = 12;
      for (let i = 0; i < total; i++) {
        setTimeout(createFallBalloon, i * 120);
      }
    }

    function flashScreen() {
      const flash = document.createElement('div');
      flash.className = 'flash-overlay';
      document.body.appendChild(flash);
      setTimeout(function() { flash.remove(); }, 650);
    }

    function shakeCard() {
      mainCard.classList.remove('celebrate-shake');
      void mainCard.offsetWidth;
      mainCard.classList.add('celebrate-shake');
      setTimeout(function() { mainCard.classList.remove('celebrate-shake'); }, 600);
    }

    const confettiPieces = [];
    let confettiAnimating = false;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti(intensity) {
      intensity = intensity || 1;
      const colors = ['#ff6b9d', '#a855f7', '#fbbf24', '#22d3ee', '#34d399', '#fb923c', '#f472b6', '#818cf8', '#fde047', '#fb7185'];
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.4;
      const count = Math.floor(180 * intensity);

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 14;
        confettiPieces.push({
          x: cx + (Math.random() - 0.5) * 160,
          y: cy + (Math.random() - 0.5) * 80,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (6 + Math.random() * 6),
          size: 7 + Math.random() * 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          spin: (Math.random() - 0.5) * 18,
          life: 1.1
        });
      }

      for (let s = 0; s < 30 * intensity; s++) {
        confettiPieces.push({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * 80,
          vx: (Math.random() - 0.5) * 4,
          vy: 3 + Math.random() * 5,
          size: 8 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          spin: (Math.random() - 0.5) * 10,
          life: 1.2
        });
      }

      if (!confettiAnimating) {
        confettiAnimating = true;
        animateConfetti();
      }
    }

    function animateConfetti() {
      const ctx = confettiCanvas.getContext('2d');
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const p = confettiPieces[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18;
        p.rotation += p.spin;
        p.life -= 0.006;

        if (p.life <= 0 || p.y > confettiCanvas.height + 20) {
          confettiPieces.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }

      if (confettiPieces.length) {
        requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimating = false;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function celebrate() {
      flashScreen();
      shakeCard();
      launchFallingBalloons();
      launchRibbons();
      burstConfetti(1.4);
      setTimeout(function() { burstConfetti(0.8); }, 350);
      setTimeout(function() { burstConfetti(0.5); }, 700);
      congrats.classList.add('show');
    }

    function spinToNumber(finalNumber, onDone) {
      isSpinning = true;
      btnStart.disabled = true;
      btnNext.disabled = true;
      congrats.classList.remove('show');
      numberDisplay.classList.remove('reveal');
      numberDisplay.classList.add('spinning');

      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / SPIN_DURATION, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const interval = SPIN_INTERVAL_START + (SPIN_INTERVAL_END - SPIN_INTERVAL_START) * eased;

        if (progress < 1) {
          numberDisplay.textContent = randomPreview();
          spinTimer = setTimeout(function() {
            requestAnimationFrame(tick);
          }, interval);
        } else {
          numberDisplay.textContent = finalNumber;
          numberDisplay.classList.remove('spinning');
          numberDisplay.classList.add('reveal');
          isSpinning = false;
          btnNext.disabled = false;
          celebrate();
          if (onDone) onDone();
        }
      }

      if (spinTimer) clearTimeout(spinTimer);
      requestAnimationFrame(tick);
    }

    function runDraw() {
      if (isSpinning || !available.length) return;

      const winner = pickRandom();
      spinToNumber(winner, function() {
        drawn.push(winner);
        renderHistory();

        btnStart.style.display = 'none';
        btnNext.classList.add('visible');

        if (!available.length) {
          btnNext.disabled = true;
          finishedMsg.classList.add('show');
        }
      });
    }

    btnStart.addEventListener('click', runDraw);
    btnNext.addEventListener('click', runDraw);

    initPool();
  </script>
</body>
