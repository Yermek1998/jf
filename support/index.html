<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қолдау қызметі — Jannat Firdays</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#10B981;
  --primary-soft:#D1FAE5;
  --text:#111827;
  --soft:#6B7280;
  --bg:#F9FAFB;
  --card:#FFFFFF;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F172A;
    --card:#1E293B;
    --text:#F8FAFC;
    --soft:#CBD5E1;
    --primary-soft:#064E3B;
  }
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

.container{
  max-width:720px;
  margin:auto;
  padding:80px 20px;
  text-align:center;
  animation:fadeUp .8s ease forwards;
}

.badge{
  display:inline-block;
  background:var(--primary-soft);
  color:var(--primary);
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:20px;
}

h1{
  font-size:36px;
  font-weight:900;
  margin-bottom:16px;
  letter-spacing:-1px;
}

.subtitle{
  font-size:16px;
  color:var(--soft);
  margin-bottom:50px;
}

.card{
  background:var(--card);
  padding:40px 30px;
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.05);
  transition:.3s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 30px 70px rgba(0,0,0,0.08);
}

.email{
  font-size:20px;
  font-weight:700;
  margin:20px 0;
}

.button{
  display:inline-block;
  background:var(--primary);
  color:white;
  padding:14px 28px;
  border-radius:999px;
  font-weight:600;
  text-decoration:none;
  margin-top:20px;
  transition:.3s ease;
}

.button:hover{
  opacity:.9;
  transform:translateY(-2px);
}

.footer{
  margin-top:80px;
  font-size:13px;
  color:var(--soft);
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<span class="badge">Support</span>

<h1>Қолдау қызметі</h1>

<div class="subtitle">
Jannat Firdays қолданбасына қатысты сұрақтарыңыз немесе техникалық мәселелер болса, бізге хабарласыңыз.
</div>

<div class="card">
<div class="email">support@jannatfirdays.app</div>
<a class="button" href="mailto:support@jannatfirdays.app">
Email жіберу
</a>
</div>

<div class="footer">
© 2026 Jannat Firdays. Барлық құқықтар қорғалған.
</div>

</div>

</body>
</html>
